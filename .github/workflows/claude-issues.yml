name: Claude fixes issues
on:
  issues:
    types: [opened, labeled]

jobs:
  fix-issue:
    # Only runs on issues labeled "claude", so it doesn't touch every issue
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # or: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Find the cause, implement a fix, run the tests if there are any,
            and open a pull request that references the issue.
            If the issue is unclear, comment on it asking for details instead of guessing.
          claude_args: "--max-turns 20"