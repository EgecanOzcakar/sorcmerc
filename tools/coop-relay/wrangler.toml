# The co-op relay. Nothing secret in here: there is no credential — a room
# code is the only key, and the relay stores game intents, nothing personal.
#   npx wrangler deploy      (from this directory)

name = "sorcmerc-coop-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones the free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
